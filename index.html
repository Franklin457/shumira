<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para Shumira 🌻</title>
    <link rel="stylesheet" href="css/css.css">
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Poppins:ital,wght@0,500;1,900&display=swap" rel="stylesheet">
</head>
<body>
    <div class="stars" id="stars"></div>

    <div class="greetings">
        <span>S</span><span>H</span><span>U</span><span>M</span><span>I</span><span>R</span><span>A</span>
    </div>

    <div class="description">
        <span>✨ tengo un regalito para ti ✨</span>
    </div>

    <div class="button">
        <button onclick="window.location.href='flores.html'">
            🌻 Abrir regalo
        </button>
    </div>

    <script>
        const c = document.getElementById('stars');
        for(let i=0;i<120;i++){
            const s=document.createElement('div');
            s.className='star';
            const sz=1+Math.random()*2.5;
            s.style.cssText=`width:${sz}px;height:${sz}px;top:${Math.random()*100}%;left:${Math.random()*100}%;animation-duration:${2+Math.random()*4}s;animation-delay:${Math.random()*4}s`;
            c.appendChild(s);
        }
    </script>
</body>
</html>
